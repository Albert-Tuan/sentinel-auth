# Sentinel Auth v3.3 — Continuous Integration
#
# The pipeline provisions three disposable PostgreSQL databases, loads each
# one from its canonical schema, and runs the whole pytest suite plus the
# M10 real-HTTP smoke script against them.
#
# Triggers:
#   - pull requests targeting `dev` or `main`
#   - pushes to `dev`
#
# Every secret used here is generated *inside* the runner from a throwaway
# value.  No production credential is stored in GitHub, and no credential is
# printed to the log.

name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test & Smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Fail fast, but still show which Python version broke.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # --- Timezone isolation -------------------------------------------
      # The runner's default timezone is never relied upon.  The PostgreSQL
      # server is pinned to UTC by the bootstrap script (``ALTER SYSTEM SET
      # timezone``), which is the authoritative pin, and the Python process
      # is pinned to UTC here so the two agree.
      #
      # ``PGTZ`` is deliberately NOT set: libpq would send it as a startup
      # parameter, and it takes precedence over the ``options="-c timezone=…"``
      # override that the timezone-isolation tests use to force a foreign
      # zone.  Setting it would silently neuter those tests.
      TZ: UTC
      PYTHONHASHSEED: "0"

      # --- Disposable PostgreSQL ----------------------------------------
      # These are throwaway values for a container that lives and dies with
      # the job.  They are not secrets and are not reused anywhere.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_ci_disposable
      # libpq reads the password from ``PGPASSWORD``, not from
      # ``POSTGRES_PASSWORD``.  Without this the ``psql`` calls in the
      # diagnostics and teardown steps fail with "no password supplied" -
      # and, because those steps tolerate failures, the teardown would
      # report success while dropping nothing.
      PGPASSWORD: sentinel_ci_disposable

      # The three disposable databases.
      CORE_DB: sentinel_core_test
      DETECTION_DB: sentinel_detection_test
      ML_DB: sentinel_ml_test

      # The legacy single-database layout used by the older PostgreSQL
      # modules.  It points at a *fourth* disposable database so those
      # modules - which apply all three schemas into one database - cannot
      # contaminate the three-database topology the live suite proves.
      POSTGRES_DB: sentinel_legacy_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci_disposable
          POSTGRES_DB: postgres
          # The server timezone is pinned by the bootstrap script's
          # ``ALTER SYSTEM SET timezone``, which also verifies the result.
          TZ: UTC
          # Authentication parity with the local/demo deployment
          # (``docker-compose.yml``): the loopback "trust" lines that
          # ``initdb`` writes by default are removed, so every connection
          # must present a password.
          #
          # ``initdb`` only reads these arguments when it initialises a
          # FRESH data directory.  The service container starts with an
          # empty one on every run, so the setting always takes effect
          # here - but the same caveat applies to any long-lived volume:
          # changing this later does NOT re-initialise an existing
          # cluster.
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # -------------------------------------------------------------------
      # 1. Check out the code
      # -------------------------------------------------------------------
      - name: Check out the repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. Set up Python with a dependency cache
      # -------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # -------------------------------------------------------------------
      # 3. Generate the test-only internal secret
      #
      # The value is generated inside the runner, masked so that even an
      # accidental echo cannot leak it, and stored in the job's environment
      # only for the steps that need it.  It is never committed and never
      # stored in GitHub.
      #
      # It is deliberately NOT exported to the pytest step: the suite's own
      # ``tests/conftest.py`` installs its own session-scoped secret, and an
      # ambient value would override it and break the tests that assert the
      # internal-auth boundary.  The smoke script is the only step that
      # needs a runner-generated secret, because it starts a real server.
      # -------------------------------------------------------------------
      - name: Generate the test-only internal secret
        run: |
          set -euo pipefail
          secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          if [ "${#secret}" -lt 32 ]; then
            echo "the generated internal secret is shorter than 32 characters" >&2
            exit 1
          fi
          echo "::add-mask::${secret}"
          {
            echo "CI_INTERNAL_SECRET=${secret}"
          } >> "${GITHUB_ENV}"
          echo "the test-only internal secret was generated and masked"

      # -------------------------------------------------------------------
      # 4. Install the dependencies from the repository's own files
      # -------------------------------------------------------------------
      - name: Install the Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # A dependency conflict in the resolved tree is a broken
          # environment, not a test failure - fail loudly and early.
          #
          # ``pip check`` inspects the WHOLE interpreter, and the hosted
          # runner ships pre-installed packages whose own dependencies may be
          # broken.  Only a conflict that involves one of OUR declared
          # distributions is a CI failure; the rest is printed for context
          # and ignored.
          python -m pip check > /tmp/pip-check.txt 2>&1 || true
          if grep -E '^(fastapi|uvicorn|httpx|pydantic|sqlalchemy|psycopg|psycopg2|psycopg2-binary|argon2-cffi|pytest|pytest-asyncio|joblib|numpy|scikit-learn) ' /tmp/pip-check.txt; then
            echo "a declared dependency of this repository is broken" >&2
            exit 1
          fi
          echo "the declared dependency tree is consistent"

      # -------------------------------------------------------------------
      # 5. Verify the disposable PostgreSQL is reachable
      # -------------------------------------------------------------------
      - name: Verify the PostgreSQL service is reachable
        run: |
          set -euo pipefail
          # The hosted image ships the PostgreSQL client, but the script must
          # not depend on that: install it if it is missing.
          if ! command -v psql >/dev/null 2>&1; then
            echo "the PostgreSQL client is missing - installing it"
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}"; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      # -------------------------------------------------------------------
      # 6. Verify the PostgreSQL authentication is SCRAM, not trust
      #
      # The service container pins ``POSTGRES_INITDB_ARGS`` so the
      # loopback "trust" lines that ``initdb`` writes by default are
      # removed.  This step PROVES the resulting configuration:
      #
      #   * the correct password is accepted;
      #   * a TCP connection WITHOUT a password is rejected;
      #   * a TCP connection with a WRONG password is rejected;
      #   * the effective ``pg_hba`` rules contain no "trust" entry for a
      #     host connection;
      #   * the stored password is a SCRAM verifier.
      #
      # A "trust" server would accept every one of the rejected attempts,
      # so this step fails loudly instead of letting the CI run against a
      # password-less database.
      #
      # Every ``psql`` call passes ``PGPASSWORD`` explicitly.  The job
      # environment also defines it, but an explicit value keeps the step
      # independent of an ambient variable that could carry a stale
      # password.
      # -------------------------------------------------------------------
      - name: Verify the PostgreSQL authentication is SCRAM, not trust
        run: |
          set -euo pipefail
          failed=0

          # --- 1. the correct password is accepted ------------------------
          if PGPASSWORD="${POSTGRES_PASSWORD}" psql -w \
            -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
            -d postgres -Atc "SELECT 'connected with the correct password';"; then
            echo "OK: the correct password was accepted"
          else
            echo "ERROR: the correct password was rejected" >&2
            failed=1
          fi

          # --- 2. a TCP connection without a password is rejected --------
          # ``-w`` makes psql never prompt, so the attempt fails fast
          # instead of hanging on an interactive prompt.
          if PGPASSWORD="" psql -w \
            -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
            -d postgres -Atc "SELECT 1;" > /tmp/no-password.out 2>&1; then
            echo "ERROR: a TCP connection without a password was ACCEPTED - the server is not enforcing SCRAM" >&2
            cat /tmp/no-password.out >&2
            failed=1
          else
            echo "OK: the TCP connection without a password was rejected"
            # The message names the authentication method, so a log reader
            # can tell a password rejection from a network failure.
            if grep -q "no password supplied" /tmp/no-password.out \
              || grep -qi "password authentication failed" /tmp/no-password.out; then
              echo "OK: the rejection was an authentication failure"
            else
              echo "ERROR: the rejection was not an authentication failure" >&2
              cat /tmp/no-password.out >&2
              failed=1
            fi
          fi

          # --- 3. a TCP connection with a WRONG password is rejected ------
          # This is the check a "trust" server can never pass: trust
          # accepts the connection before the password is ever examined.
          if PGPASSWORD="definitely-not-the-right-password" psql -w \
            -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
            -d postgres -Atc "SELECT 1;" > /tmp/wrong-password.out 2>&1; then
            echo "ERROR: a TCP connection with a wrong password was ACCEPTED - the server is not enforcing SCRAM" >&2
            cat /tmp/wrong-password.out >&2
            failed=1
          else
            echo "OK: the TCP connection with a wrong password was rejected"
            if grep -qi "password authentication failed" /tmp/wrong-password.out; then
              echo "OK: the rejection named the authentication failure"
            else
              echo "ERROR: the rejection was not an authentication failure" >&2
              cat /tmp/wrong-password.out >&2
              failed=1
            fi
          fi

          # --- 4. the effective pg_hba rules contain no host "trust" ------
          trust_rules="$(PGPASSWORD="${POSTGRES_PASSWORD}" psql -w \
            -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
            -d postgres -Atc \
            "SELECT count(*) FROM pg_hba_file_rules
              WHERE type = 'host' AND auth_method = 'trust';" 2>&1 || echo "unknown")"
          if [ "${trust_rules}" = "0" ]; then
            echo "OK: no host connection trusts an unauthenticated client"
          else
            echo "ERROR: pg_hba_file_rules reports ${trust_rules} host 'trust' entr(y/ies)" >&2
            failed=1
          fi

          # --- 5. the stored password is a SCRAM verifier ------------------
          scram_stored="$(PGPASSWORD="${POSTGRES_PASSWORD}" psql -w \
            -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
            -d postgres -Atc \
            "SELECT count(*) FROM pg_authid
              WHERE rolname = '${POSTGRES_USER}'
                AND rolpassword LIKE 'SCRAM-SHA-256\$%';" 2>&1 || echo "0")"
          if [ "${scram_stored}" = "1" ]; then
            echo "OK: the role's password is stored as a SCRAM-SHA-256 verifier"
          else
            echo "ERROR: the role's password is not stored as a SCRAM verifier" >&2
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "the PostgreSQL authentication is not SCRAM-enforced" >&2
            exit 1
          fi
          echo "the PostgreSQL authentication is SCRAM-enforced"

      # -------------------------------------------------------------------
      # 7. Provision the three disposable databases from the canonical
      #    schema files
      # -------------------------------------------------------------------
      - name: Provision the three disposable databases
        run: |
          set -euo pipefail
          bash scripts/ci_bootstrap_postgres.sh

      # -------------------------------------------------------------------
      # 8. Export the connection URLs the suite reads
      #
      # The URLs are assembled from the disposable container's own
      # coordinates.  The password is the throwaway value declared above.
      #
      # Only the ``*_TEST_URL`` variables are exported globally.  The
      # application's own ``*_DATABASE_URL`` variables are set per step:
      # the unit tests override every session dependency, and exporting a
      # real database URL globally would let a test reach the disposable
      # PostgreSQL instead of its own SQLite session.
      # -------------------------------------------------------------------
      - name: Export the disposable connection URLs
        run: |
          set -euo pipefail
          {
            echo "CORE_DETECTION_TEST_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${CORE_DB}"
            echo "CORE_ANALYTICS_TEST_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${CORE_DB}"
            echo "DETECTION_TEST_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${DETECTION_DB}"
            echo "ML_TEST_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ML_DB}"
          } >> "${GITHUB_ENV}"
          # Print the targets, never the credentials.
          echo "the disposable connection URLs were exported (credentials withheld)"

      # -------------------------------------------------------------------
      # 9. Run the full test suite under the acceptance policy
      # -------------------------------------------------------------------
      - name: Run the full pytest suite (zero failures, zero skips)
        run: |
          set -euo pipefail
          python scripts/ci_verify_tests.py

      # -------------------------------------------------------------------
      # 10. Run the M10 real-HTTP smoke script
      #
      # The script starts a real uvicorn socket, seeds the three databases
      # and exercises the Manager facade over HTTP.  It runs against the
      # same disposable infrastructure as the test suite.
      #
      # This is the only step that receives the runner-generated internal
      # secret: the script starts a real server, so the server and the
      # client must agree on one throwaway value.
      # -------------------------------------------------------------------
      - name: Run the M10 real-HTTP smoke script
        env:
          INTERNAL_SECRET: ${{ env.CI_INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          python scripts/m10_http_smoke.py

      # -------------------------------------------------------------------
      # 11. Publish the JUnit report
      # -------------------------------------------------------------------
      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: .ci/pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14

      # -------------------------------------------------------------------
      # 12. Failure diagnostics
      #
      # The diagnostics describe the environment (versions, database
      # inventory) without printing a single credential.
      # -------------------------------------------------------------------
      - name: Collect failure diagnostics
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "### Sentinel Auth CI diagnostics"
            echo
            echo "#### Python"
            python --version
            python -m pip list --format=freeze 2>/dev/null | sort
            echo
            echo "#### PostgreSQL"
            echo "server version:"
            psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
              -d postgres -Atc "SELECT version();" 2>&1 || true
            echo "server timezone:"
            psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
              -d postgres -Atc "SELECT setting FROM pg_settings WHERE name = 'TimeZone';" 2>&1 || true
            echo "databases:"
            psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
              -d postgres -Atc "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY 1;" 2>&1 || true
            echo
            echo "#### pytest summary"
            if [ -f .ci/pytest-report.xml ]; then
              grep -oE '<testsuite [^>]*' .ci/pytest-report.xml | head -5 || true
            else
              echo "no JUnit report was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}" 2>&1 || true
          echo "the diagnostics were written to the job summary"

      # -------------------------------------------------------------------
      # 13. Clean teardown
      #
      # The service container is destroyed with the job.  This step drops
      # the disposable databases explicitly so a reused runner never keeps
      # a stale schema, and it never touches anything outside the three
      # ``*_test`` databases.
      #
      # The drops are verified, not assumed: the step drops each database
      # and then checks that it is really gone.  A silent failure here
      # would let a stale schema survive on a reused runner while the log
      # claimed a clean teardown.
      # -------------------------------------------------------------------
      - name: Tear down the disposable databases
        if: always()
        run: |
          set -uo pipefail
          failed=0
          for db_name in "${CORE_DB}" "${DETECTION_DB}" "${ML_DB}" "${POSTGRES_DB}"; do
            case "${db_name}" in
              *_test) ;;
              *) echo "skipping ${db_name}: not a disposable test database"; continue ;;
            esac
            if ! psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
              -d postgres -c "DROP DATABASE IF EXISTS \"${db_name}\";" 2>&1; then
              echo "ERROR: could not drop ${db_name}" >&2
              failed=1
              continue
            fi
            remaining="$(psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" \
              -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname = '${db_name}';" 2>&1)"
            if [ "${remaining}" != "0" ]; then
              echo "ERROR: ${db_name} still exists after the drop (count=${remaining})" >&2
              failed=1
            else
              echo "dropped ${db_name}"
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "the teardown did not drop every disposable database" >&2
            exit 1
          fi
          echo "the disposable databases were dropped"

  # ---------------------------------------------------------------------------
  # Frontend — hermetic unit/component pass
  # ---------------------------------------------------------------------------
  # This job is deliberately independent of the backend job: it needs no
  # database, no network and no credential, so a frontend regression is
  # reported as a frontend regression instead of being buried in a backend
  # failure.
  #
  # The job proves, in this order:
  #   1. `npm ci`          — the lockfile installs reproducibly
  #   2. `tsc -b`          — a strict TypeScript check (no emit)
  #   3. `eslint .`        — lint
  #   4. `vitest run`      — unit/component tests, hermetic (no backend)
  #   5. `npm run build`   — the production bundle
  frontend:
    name: Frontend (unit & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -------------------------------------------------------------------
      # `npm ci` installs exactly what the lockfile pins — it never resolves
      # a range, so a drifting dependency cannot enter the build.
      # -------------------------------------------------------------------
      - name: Install the frontend dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # The strict typecheck.  `tsc -b` uses the project references
      # (tsconfig.app.json + tsconfig.node.json), so BOTH the application
      # and the build configuration are checked.
      # -------------------------------------------------------------------
      - name: Type-check (strict TypeScript)
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      # -------------------------------------------------------------------
      # The hermetic unit/component suite.  `vitest.config.ts` excludes
      # `src/test/integration/**`, so nothing here talks to a backend.
      # -------------------------------------------------------------------
      - name: Run the unit/component tests
        run: npm run test

      # -------------------------------------------------------------------
      # The production build.  `npm run build` runs `tsc -b` itself, so the
      # bundle can only be produced from a type-correct tree.
      # -------------------------------------------------------------------
      - name: Build the production bundle
        run: npm run build

      - name: Publish the build summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Frontend build summary"
            echo
            echo "- node: $(node --version)"
            echo "- npm: $(npm --version)"
            if [ -d dist ]; then
              echo "- bundle:"
              du -sh dist
              ls -1 dist/assets 2>/dev/null | sed 's/^/  - /' || true
            else
              echo "- no \`dist/\` directory was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}" 2>&1 || true

  # ---------------------------------------------------------------------------
  # Frontend — real HTTP integration pass
  # ---------------------------------------------------------------------------
  # This job runs the frontend's REAL integration suite: the tests under
  # `frontend/src/test/integration` talk to a live FastAPI server over real
  # HTTP, with no mock and no MSW.  They exercise the real axios client
  # (including the refresh interceptor), the real in-memory token store and
  # the real auth state machine.
  #
  # It is a SEPARATE job on purpose: the unit/component suite above must
  # never be presented as integration coverage.  The evidence this job
  # produces is a real server, a real database and a real SMTP hop.
  frontend-integration:
    name: Frontend (real HTTP integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: UTC
      PYTHONHASHSEED: "0"

      # --- Disposable PostgreSQL ------------------------------------------
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_ci_disposable
      PGPASSWORD: sentinel_ci_disposable

      CORE_DB: sentinel_core_test
      DETECTION_DB: sentinel_detection_test
      ML_DB: sentinel_ml_test
      POSTGRES_DB: sentinel_legacy_test

      # --- The live backend -----------------------------------------------
      M12_API_ORIGIN: http://127.0.0.1:8000
      M12_API_ROOT: http://127.0.0.1:8000/api/v1
      M12_OTP_LOG: /tmp/m12_otp_capture.log
      # The integration suite talks to the database directly for its
      # rate-limiter housekeeping.  This URL makes the `psql` client run
      # directly instead of going through a container runtime.
      M12_DATABASE_URL: postgresql://sentinel:sentinel_ci_disposable@127.0.0.1:5432/sentinel_core_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci_disposable
          POSTGRES_DB: postgres
          TZ: UTC
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # -------------------------------------------------------------------
      # The throwaway internal secret.  It is generated inside the runner,
      # masked, and never stored in GitHub.
      # -------------------------------------------------------------------
      - name: Generate the test-only internal secret and the fixture passwords
        run: |
          set -euo pipefail
          secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${secret}"
          {
            echo "CI_INTERNAL_SECRET=${secret}"
            echo "M12_USER_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
            echo "M12_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
            echo "M12_MANAGER_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
            echo "M12_PLAIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          } >> "${GITHUB_ENV}"

      - name: Provision the disposable databases
        run: bash scripts/ci_bootstrap_postgres.sh

      - name: Seed the frontend integration fixtures
        env:
          CORE_DATABASE_URL: postgresql://sentinel:sentinel_ci_disposable@127.0.0.1:5432/sentinel_core_test
          M12_USER_PASSWORD: ${{ env.M12_USER_PASSWORD }}
          M12_ADMIN_PASSWORD: ${{ env.M12_ADMIN_PASSWORD }}
          M12_MANAGER_PASSWORD: ${{ env.M12_MANAGER_PASSWORD }}
          M12_PLAIN_PASSWORD: ${{ env.M12_PLAIN_PASSWORD }}
        run: python scripts/ci_seed_frontend_users.py

      # -------------------------------------------------------------------
      # The SMTP sink.  The MFA handshake has to deliver a REAL OTP through
      # a real SMTP hop — the suite reads it back from the capture file.
      # -------------------------------------------------------------------
      - name: Start the SMTP capture sink
        run: |
          set -euo pipefail
          nohup python scripts/ci_smtp_sink.py \
            --host 127.0.0.1 --port 1025 --log "${M12_OTP_LOG}" \
            > /tmp/smtp_sink.log 2>&1 &
          echo "SMTP_SINK_PID=$!" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 30); do
            if python -c "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',1025)); s.close()"; then
              echo "the SMTP sink is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "the SMTP sink did not start" >&2
          cat /tmp/smtp_sink.log >&2 || true
          exit 1

      # -------------------------------------------------------------------
      # The live backend.  It runs against the SAME disposable databases the
      # suite inspects, and it is the real application — the real router,
      # the real RBAC layer, the real token rotation.
      #
      # `DETECTION_URL` is empty on purpose: the Detection Engine is a
      # separate bounded context with its own CI coverage, and the frontend
      # contract under test is the Core/Auth API.  With Detection absent,
      # Core takes its documented fail-open path.
      # -------------------------------------------------------------------
      - name: Start the backend
        env:
          INTERNAL_SECRET: ${{ env.CI_INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          export CORE_DATABASE_URL="postgresql://sentinel:sentinel_ci_disposable@127.0.0.1:5432/sentinel_core_test"
          export DETECTION_DATABASE_URL="postgresql://sentinel:sentinel_ci_disposable@127.0.0.1:5432/sentinel_detection_test"
          export ML_DATABASE_URL="postgresql://sentinel:sentinel_ci_disposable@127.0.0.1:5432/sentinel_ml_test"
          export DETECTION_URL=""
          export RUN_PRE_TOKEN_CHECK="0"
          export MFA_SMTP_HOST="127.0.0.1"
          export MFA_SMTP_PORT="1025"
          export CORS_ALLOWED_ORIGINS="http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000"
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --log-level warning \
            > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "the backend is answering on 127.0.0.1:8000"
              exit 0
            fi
            sleep 1
          done
          echo "the backend did not start" >&2
          cat /tmp/backend.log >&2 || true
          exit 1

      # -------------------------------------------------------------------
      # The real HTTP integration suite.
      # -------------------------------------------------------------------
      - name: Run the real HTTP integration tests
        working-directory: frontend
        env:
          M12_PASSWORD: ${{ env.M12_USER_PASSWORD }}
          M12_MFA_PASSWORD: ${{ env.M12_ADMIN_PASSWORD }}
        run: npm run test:integration

      - name: Publish the integration summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Frontend real HTTP integration"
            echo
            echo "- API origin: ${M12_API_ORIGIN}"
            echo "- OTP capture file: ${M12_OTP_LOG}"
            echo
            if [ -f "${M12_OTP_LOG}" ]; then
              echo "captured OTP messages: $(grep -c '^TO=' "${M12_OTP_LOG}" || echo 0)"
            else
              echo "no OTP capture file was produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}" 2>&1 || true

      # -------------------------------------------------------------------
      # Failure diagnostics — environment only, never a credential.
      # -------------------------------------------------------------------
      - name: Collect failure diagnostics
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "### Frontend integration diagnostics"
            echo
            echo "#### backend log"
            tail -100 /tmp/backend.log 2>/dev/null || true
            echo
            echo "#### SMTP sink log"
            tail -50 /tmp/smtp_sink.log 2>/dev/null || true
            echo
            echo "#### node"
            node --version
          } >> "${GITHUB_STEP_SUMMARY}" 2>&1 || true

      - name: Stop the backend and the SMTP sink
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${BACKEND_PID:-}" ]; then
            kill "${BACKEND_PID}" 2>/dev/null || true
          fi
          if [ -n "${SMTP_SINK_PID:-}" ]; then
            kill "${SMTP_SINK_PID}" 2>/dev/null || true
          fi
          echo "the backend and the SMTP sink were stopped"
