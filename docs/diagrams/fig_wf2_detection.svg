<text x="500.0" y="30.2" text-anchor="middle" font-size="18" fill="#2C3E50" font-family="Arial,sans-serif">WF-2: Detection Inline (Risk Assessment)</text>
<rect x="60.0" y="60.0" width="110.0" height="40.0" rx="5" ry="5" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.0"/>
<text x="115.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">Auth API (gọi sau login)</text>
<rect x="250.0" y="60.0" width="110.0" height="40.0" rx="5" ry="5" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="305.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">Detection Service</text>
<rect x="460.0" y="60.0" width="120.0" height="40.0" rx="5" ry="5" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.0"/>
<text x="520.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">ML Scoring (Isolation Forest)</text>
<rect x="680.0" y="60.0" width="110.0" height="40.0" rx="5" ry="5" fill="#F5F5F5" stroke="#666666" stroke-width="1.0"/>
<text x="735.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">PostgreSQL</text>
<rect x="120.0" y="110.0" width="170.0" height="55.0" rx="0" ry="0" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.0"/>
<text x="205.0" y="139.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">1. POST /internal/v1/detect (login_attempt_id, user_id, source_ip, user_agent...)</text>
<rect x="320.0" y="110.0" width="160.0" height="55.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="400.0" y="139.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">2. SELECT user history (fail_count_24h, known_devices, last_login_ip...)</text>
<text x="495.0" y="186.3" text-anchor="middle" font-size="9" fill="#888" font-family="Arial,sans-serif">user context</text>
<rect x="270.0" y="195.0" width="160.0" height="55.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="350.0" y="224.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">3. Trích features (IP mới? | Fail &gt; 3? | Giờ lạ? | Device mới?)</text>
<rect x="270.0" y="265.0" width="150.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="345.0" y="289.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">4. Tính rule_score (0.0 – 1.0)</text>
<rect x="350.0" y="325.0" width="160.0" height="45.0" rx="0" ry="0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.0"/>
<text x="430.0" y="349.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">5. POST /internal/v1/ml/score (features_vector)</text>
<rect x="470.0" y="325.0" width="140.0" height="55.0" rx="0" ry="0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.0"/>
<text x="540.0" y="354.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">6. Isolation Forest predict() (timeout: 500ms)</text>
<rect x="340.0" y="385.0" width="150.0" height="45.0" rx="5" ry="5" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.0"/>
<text x="415.0" y="409.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">7. {anomaly_score, is_anomaly, reason_codes}</text>
<rect x="270.0" y="445.0" width="160.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="350.0" y="469.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">8. risk = combine( rule_score, anomaly_score)</text>
<rect x="250.0" y="505.0" width="110.0" height="75.0" rx="0" ry="0" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.0"/>
<text x="305.0" y="544.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">risk_level HIGH / CRITICAL?</text>
<rect x="510.0" y="525.0" width="130.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="575.0" y="549.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">9. INSERT risk_assessment</text>
<text x="590.0" y="526.4" text-anchor="middle" font-size="9" fill="#888" font-family="Arial,sans-serif">luôn lưu</text>
<rect x="510.0" y="585.0" width="130.0" height="45.0" rx="0" ry="0" fill="#FFE6CC" stroke="#CC0000" stroke-width="1.0"/>
<text x="575.0" y="609.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">10. INSERT alert (status=open)</text>
<text x="420.0" y="581.4" text-anchor="middle" font-size="9" fill="#CC0000" font-family="Arial,sans-serif">YES → alert</text>
<rect x="60.0" y="600.0" width="150.0" height="45.0" rx="5" ry="5" fill="#D5E8D4" stroke="#82B366" stroke-width="1.0"/>
<text x="135.0" y="624.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">11. {alert_created: true, risk_level: high}</text>
<text x="60.0" y="549.0" text-anchor="middle" font-size="10" fill="#888" font-family="Arial,sans-serif">NO → 200 OK no alert</text>
<rect x="580.0" y="310.0" width="120.0" height="70.0" rx="0" ry="0" fill="#FFE6CC" stroke="#CC6600" stroke-width="1.0"/>
<text x="640.0" y="346.3" text-anchor="middle" font-size="9" fill="#000000" font-family="Arial,sans-serif">ML unavailable? → ml_status=error → risk_level=medium</text>
<text x="680.0" y="351.3" text-anchor="middle" font-size="9" fill="#CC6600" font-family="Arial,sans-serif">fallback</text>
</svg>