  <path d="M 700.0,250.0 L 700.0,340.0" stroke="#9673A6" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)" stroke-dasharray="4,3"/>
<text x="460.0" y="30.2" text-anchor="middle" font-size="18" fill="#2C3E50" font-family="Arial,sans-serif">WF-3: SOC — Xem và xử lý Alert</text>
<rect x="40.0" y="60.0" width="100.0" height="40.0" rx="5" ry="5" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="90.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">SOC Analyst (Browser)</text>
<rect x="220.0" y="60.0" width="120.0" height="40.0" rx="5" ry="5" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.0"/>
<text x="280.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">Auth API (SOC endpoints)</text>
<rect x="440.0" y="60.0" width="110.0" height="40.0" rx="5" ry="5" fill="#F5F5F5" stroke="#666666" stroke-width="1.0"/>
<text x="495.0" y="81.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">PostgreSQL</text>
<text x="380.0" y="119.3" text-anchor="middle" font-size="12" fill="#17A2B8" font-family="Arial,sans-serif">─── List Alerts ───</text>
<rect x="100.0" y="140.0" width="170.0" height="55.0" rx="0" ry="0" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="185.0" y="169.2" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">1. GET /api/v1/alerts ?status=open &amp;risk_level=high</text>
<rect x="300.0" y="140.0" width="160.0" height="55.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="380.0" y="169.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">2. SELECT alerts WHERE status=? AND risk_level=?</text>
<rect x="60.0" y="220.0" width="160.0" height="60.0" rx="5" ry="5" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="140.0" y="251.5" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">3. {alerts: [   {id, risk_level,   user_id, created_at...} ]}</text>
<text x="380.0" y="319.3" text-anchor="middle" font-size="12" fill="#17A2B8" font-family="Arial,sans-serif">─── Alert Detail ───</text>
<rect x="100.0" y="340.0" width="160.0" height="40.0" rx="0" ry="0" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="180.0" y="361.7" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">4. GET /alerts/{id}</text>
<rect x="300.0" y="340.0" width="160.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="380.0" y="364.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">5. SELECT alert + login_attempt info</text>
<rect x="60.0" y="405.0" width="150.0" height="45.0" rx="5" ry="5" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="135.0" y="429.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">6. {alert + login_attempt detail}</text>
<text x="350.0" y="484.3" text-anchor="middle" font-size="12" fill="#17A2B8" font-family="Arial,sans-serif">─── Handle Alert (Acknowledge / Resolve) ───</text>
<rect x="100.0" y="505.0" width="160.0" height="55.0" rx="0" ry="0" fill="#CCE5FF" stroke="#17A2B8" stroke-width="1.0"/>
<text x="180.0" y="534.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">7. PATCH /alerts/{id} {status, notes, resolved_by?}</text>
<rect x="300.0" y="505.0" width="170.0" height="55.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="385.0" y="534.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">8. UPDATE alert (status, assigned_to, resolved_by, resolved_at)</text>
<rect x="60.0" y="580.0" width="170.0" height="55.0" rx="5" ry="5" fill="#D5E8D4" stroke="#82B366" stroke-width="1.0"/>
<text x="145.0" y="609.0" text-anchor="middle" font-size="10" fill="#000000" font-family="Arial,sans-serif">9. {alert: {status: acknowledged hoặc resolved...}}</text>
<text x="695.0" y="119.1" text-anchor="middle" font-size="11" fill="#2C3E50" font-family="Arial,sans-serif">Alert State Machine</text>
<rect x="660.0" y="145.0" width="80.0" height="40.0" rx="0" ry="0" fill="#FFE6CC" stroke="#CC0000" stroke-width="1.0"/>
<text x="700.0" y="166.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">open</text>
<rect x="640.0" y="210.0" width="120.0" height="40.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="700.0" y="231.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">acknowledged</text>
<rect x="640.0" y="275.0" width="120.0" height="40.0" rx="0" ry="0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.0"/>
<text x="700.0" y="296.8" text-anchor="middle" font-size="12" fill="#000000" font-family="Arial,sans-serif">resolved</text>
<rect x="640.0" y="340.0" width="120.0" height="40.0" rx="0" ry="0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.0"/>
<text x="700.0" y="361.7" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">false_positive</text>
<text x="750.0" y="200.8" text-anchor="middle" font-size="9" fill="#666" font-family="Arial,sans-serif">acknowledge</text>
<text x="740.0" y="265.8" text-anchor="middle" font-size="9" fill="#666" font-family="Arial,sans-serif">resolve</text>
<text x="750.0" y="303.8" text-anchor="middle" font-size="9" fill="#9673A6" font-family="Arial,sans-serif">mark false positive</text>
</svg>