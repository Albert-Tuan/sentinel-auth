  <rect width="100%" height="100%" fill="white"/>
  <path d="M 90.0,100.0 L 90.0,660.0" stroke="#17A2B8" stroke-width="1.0" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M 280.0,100.0 L 280.0,660.0" stroke="#6C8EBF" stroke-width="1.0" fill="none" marker-end="url(#arrow)"/>
  <path d="M 495.0,100.0 L 495.0,660.0" stroke="#666666" stroke-width="1.0" fill="none" marker-end="url(#arrow)"/>
  <path d="M 90.0,167.0 L 220.0,167.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280.0,167.0 L 440.0,167.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 90.0,245.0 L 220.0,245.0" stroke="#17A2B8" stroke-width="2.0" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M 90.0,360.0 L 220.0,360.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280.0,362.0 L 440.0,362.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 90.0,425.0 L 220.0,425.0" stroke="#17A2B8" stroke-width="2.0" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M 90.0,532.0 L 220.0,532.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280.0,532.0 L 440.0,532.0" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 90.0,605.0 L 220.0,605.0" stroke="#82B366" stroke-width="2.0" fill="none" marker-end="url(#arrow-green)"/>
