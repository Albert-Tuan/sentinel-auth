 y="729.8976">C&#7845;u tr&#250;c m&#7897;t quy t&#7855;c (l&#432;u trong JSONB):</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="307.8448" x="364.3575" y="748.9655">`{ id, name, condition, weight, score, enabled }`</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="3.64" x="364.3575" y="768.0334">&#160;</text><text fill="#000000" font-family="Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="345.7567" x="364.3575" y="787.1014">V&#236; sao c&#243; c&#7843; `weight` (tr&#7885;ng s&#7889;) l&#7851;n `score` (&#273;i&#7875;m)?</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="309.8188" x="364.3575" y="806.1693">- `score` = quy t&#7855;c &#273;&#243; nghi&#234;m tr&#7885;ng c&#7905; n&#224;o (0-1)</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="350.3767" x="364.3575" y="825.2372">- `weight` = quy t&#7855;c &#273;&#243; &#273;&#225;ng tin c&#7905; n&#224;o trong t&#7893;ng th&#7875;</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="320.4853" x="364.3575" y="844.3051">- Nh&#226;n hai gi&#225; tr&#7883; &#8594; &#273;&#243;ng g&#243;p th&#7921;c t&#7871; c&#7911;a quy t&#7855;c</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="3.64" x="364.3575" y="863.373">&#160;</text><text fill="#000000" font-family="Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="318.0088" x="364.3575" y="882.4409">Quy t&#7855;c &#7903; &#273;&#226;y l&#224; "lu&#7853;t ch&#417;i c&#7913;ng" (hard rules):</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="421.2862" x="364.3575" y="901.5089">d&#7877; hi&#7875;u, d&#7877; gi&#7843;i th&#237;ch cho SOC, kh&#244;ng c&#7847;n d&#7919; li&#7879;u &#273;&#7875; hu&#7845;n luy&#7879;n,</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="294.4188" x="364.3575" y="920.5768">nh&#432;ng k&#7867; t&#7845;n c&#244;ng h&#7885;c &#273;&#432;&#7907;c th&#236; s&#7869; v&#432;&#7907;t qua.</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="325.8472" x="364.3575" y="939.6447">&#8594; &#272;&#243; l&#224; l&#253; do c&#7847;n th&#234;m &#273;i&#7875;m t&#7915; m&#244; h&#236;nh h&#7885;c m&#225;y.</text><!--SRC=[TLRXInnN4F- -VyLWltZ7AUUTfb58WraqsjWpqKkW8Dojk-lkujvxPlUjOaEWGPeIR41BImabD1SheSOqjWP2Tqa3VS6F_H_MlwGpRy-xrMi4xtRVl9dVp6_c_Tw5gnvRCmAZ1Sk6kUe4F6AMpdqUm2VJwayBkpj2rx3uXiSSM37yqCvPB7l5Y7mnpPce6IqR5WqMvio1RGg3ERuDzpI0Qtr0bwV7foV9mWFB3Zghe-DZvR5FjVkvE9D1m3SwvkfeTNAqVD5OTprpbTbX22F3bPnHUCAtARr5xoiRHYvhcbg1BsHx4qmtZVTRy67NIvEj5joDDa6ayMiJ1XSYt3F578_P1JZz-WUekVAGeJLv2Slo09y2pXmCnjT0S5ZcGd1amwE2FSuqhLVvW3uZ7zTcO54-q6VWvenyK8UPsJHvM5jYWyjfl8Uqhd7VCpqxB86P9ay410WVWfN6RJH-lZXVAmo04SBD-JdgpjGbNLU4va0MokKHk8vrF0MCkIz0k2T7-CQS9QRgUn31AdvzooR0KTjE7-r3fGekJ-Et9hxz2cDBJ0HfyXWnmpJPXV9mjGp_lEtoKnw-N5PvB8pqWLUGeGp5J-CN34B3wmV6nOOYhb4PTLK2rJx8qGkGunt8IXza5R3fQVnUOCN9DhJIvEV_mHJPdWRjQQWzS0N3ovYOkO1TkO0zri6kuZ2UxsYQV5U3V6C96AqWsslOjsIVELd7PlKR6kF2Xi1pN05y9Li2kDKTDfn2J682cbxOC71yrctCK0IHtSHjw_8P-FYl1YMh4HYDhHX6gtxIfjn_8SZNu5F94PZoJuOVnn38PvZHSeGZXIDjSXQAmF2OAA0dnUDOAdwre5Ya71vH-2UYMCICv2lcGYZRfejxQ93sJ79v9T0LisvxsLva5qV9EwECKgeXsvW3Jf-XaZWNYybdl1ldzE7tOCc_CCLpUrfg7Z6pP9kvmvhDB202ppNWmqwQxCnY0sRJ-E_RK4-JWzfrk7NxItoCVzUNsBeYwf8g4AE9uEIeqv6fEvDpvsBL5NQV1k3Xf5FO24qUsDdnqoVdTAME5Ls_q5GoOKdDJfW6XcbatRq2_-x1ODzwuyDkW-G7LKZ-19qvRD0S5gZjfikHlRQPqwHY4QTs3pAdOl4ZpDHcqlYm3ZVaKs87waHGlISqbYqoXMhut0cpikRchsiQJIKC3Nr66gEHpj2puee-rDl224nqMaefNCrPAX-rL2zOC0YjAxxGhVTSxJqhdkaDCqDtn_MKy6BwT_E71kELwDZ9OxGuydWDRpAEXyEJ1z5PFpKAqGsi-RP3h6LohHMBEXwa2DcNiTaPwDmTu9ySHPdEAmc-LfWe5hNcFV2i4Z2yx52iERCyOhC46pQDGWdKk9J0PiQoRrjmlwaXp1rvYDh7CoAm4T3CjZTXCAz01TBEbmoQAaYpEpM5gmWyr5s-aakIgWVcKCsjiocYEwIT7RN1yj18WLpFyFfyyOFk6E6nd5jM