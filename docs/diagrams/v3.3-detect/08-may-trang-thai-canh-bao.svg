th:0.5;" x1="293.87" x2="386.8377" y1="642.5317" y2="642.5317"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="72.9677" x="303.87" y="614.3618">&#273;&#227; k&#7871;t lu&#7853;n</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="64.4837" x="308.112" y="633.4297">(resolved)</text></g><g id="fp"><rect fill="#F8F9FA" height="58.1358" rx="12.5" ry="12.5" style="stroke:#495057;stroke-width:0.5;" width="116.5716" x="427.07" y="594.3958"/><line style="stroke:#495057;stroke-width:0.5;" x1="427.07" x2="543.6416" y1="642.5317" y2="642.5317"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="66.8217" x="451.9449" y="614.3618">b&#225;o nh&#7847;m</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="96.5716" x="437.07" y="633.4297">(false_positive)</text></g><ellipse cx="409.35" cy="724.5358" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="409.35" cy="724.5358" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN16"><path d="M693.72,363.7558 L693.72,435.5758 L472.44,439.5758 L693.72,443.5758 L693.72,515.404 A0,0 0 0 0 693.72,515.404 L1082.9959,515.404 A0,0 0 0 0 1082.9959,515.404 L1082.9959,373.7558 L1072.9959,363.7558 L693.72,363.7558 A0,0 0 0 0 693.72,363.7558 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1072.9959,363.7558 L1072.9959,373.7558 L1082.9959,373.7558 L1072.9959,363.7558 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.4212" x="699.72" y="382.6529">&#272;i&#7875;m quan tr&#7885;ng c&#7911;a m&#225;y tr&#7841;ng th&#225;i:</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="276.5753" x="699.72" y="400.3589">1. Ch&#7881; chuy&#7875;n &#273;&#432;&#7907;c theo &#273;&#250;ng &#273;&#432;&#7901;ng v&#7869; tr&#234;n.</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="258.8043" x="709.86" y="418.0649">Th&#7917; "k&#7871;t lu&#7853;n" m&#7897;t c&#7843;nh b&#225;o &#273;&#227; b&#225;o nh&#7847;m</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="118.8317" x="709.86" y="435.7709">&#8594; h&#7879; th&#7889;ng t&#7915; ch&#7889;i.</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="245.3753" x="699.72" y="453.4769">2. C&#7843;nh b&#225;o ch&#7881; b&#7883; &#273;&#243;ng khi &#273;&#227; ti&#7871;p nh&#7853;n</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="358.1359" x="709.86" y="471.1829">&#8594; kh&#244;ng ai "b&#7887; qua" c&#7843;nh b&#225;o m&#224; kh&#244;ng ch&#7883;u tr&#225;ch nhi&#7879;m.</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="245.2453" x="699.72" y="488.889">3. M&#7885;i l&#7847;n chuy&#7875;n tr&#7841;ng th&#225;i &#273;&#7873;u ghi v&#224;o</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="344.5913" x="709.86" y="506.595">b&#7843;ng `alert_timeline` (ai, l&#250;c n&#224;o, t&#7915; &#273;&#226;u sang &#273;&#226;u, l&#253; do).</text></g><g id="elem_GMN19"><path d="M6,168.5158 L6,284.7519 A0,0 0 0 0 6,284.7519 L344.7073,284.7519 A0,0 0 0 0 344.7073,284.7519 L344.7073,230.6358 L379.04,226.6358 L344.7073,222.6358 L344.7073,178.5158 L334.7073,168.5158 L6,168.5158 A0,0 0 0 0 6,168.5158 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M334.7073,168.5158 L334.7073,178.5158 L344.7073,178.5158 L334.7073,168.5158 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.0111" x="12" y="187.4129">Chuy&#7875;n c&#7845;p (escalate)</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="120.2501" x="156.3911" y="187.4129">trong t&#224;i li&#7879;u l&#224; m&#7897;t</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="317.7073" x="12" y="205.1189">*s&#7921; ki&#7879;n &#273;&#432;&#7907;c ghi nh&#7853;n*, kh&#244;ng ph&#7843;i m&#7897;t tr&#7841;ng th&#225;i</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="286.4813" x="12" y="222.8249">&#273;&#243;ng thay th&#7871;: analyst ghi nh&#7853;n r&#7891;i chuy&#7875;n cho</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="270.5173" x="12" y="240.5309">qu&#7843;n l&#253; an ninh, v&#224; v&#7851;n ph&#7843;i k&#7871;t lu&#7853;n sau &#273;&#243;.</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="3.38" x="12" y="258.2369">&#160;</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="288.8602" x="12" y="275.9429">`alert_timeline.event_type` c&#243; gi&#225; tr&#7883; `escalated`.</text></g><!--link *start* to open--><g id="link_*start*_open"><path d="M410.35,71.7558 C410.35,95.5458 410.35,153.6758 410.35,191.2158 " fill="none" id="*start*-to-open" style="stroke:#343A40;stroke-width:1.2;"/><polygon fill="#343A40" points="410.35,197.2158,414.35,188.2158,410.35,192.2158,406.35,188.2158,410.35,197.2158" style="stroke:#343A40;stroke-width:1.2;"/><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="113.2041" x="443.3495" y="116.4129">WF-2 t&#7841;o c&#7843;nh b&#225;o</text><text fill="#000000" font-family="Sans" font-size="13" lengthAdjust="spacing" textLength="177.2032" x="411.35" y="134.1189">(m&#7913;c CAO / NGHI&#202;M TR&#7884;NG)</text></g><!--link open to open--><g id="link_open_open"><path d="M441.6,209.3358 C459.6,205.8058 47