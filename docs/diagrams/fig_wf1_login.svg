<text x="360.0" y="199.2" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">2. SELECT user WHERE username</text>
<text x="355.0" y="251.5" text-anchor="middle" font-size="10" fill="#82B366" font-family="Arial,sans-serif">user record (hash, status)</text>
<rect x="220.0" y="255.0" width="100.0" height="70.0" rx="0" ry="0" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.0"/>
<text x="270.0" y="291.7" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">credentials valid?</text>
<text x="85.0" y="279.0" text-anchor="middle" font-size="10" fill="#CC0000" font-family="Arial,sans-serif">401 Invalid credentials</text>
<text x="60.0" y="311.3" text-anchor="middle" font-size="9" fill="#888" font-family="Arial,sans-serif">(generic error không leak)</text>
<rect x="270.0" y="340.0" width="100.0" height="70.0" rx="0" ry="0" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.0"/>
<text x="320.0" y="376.7" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">MFA enabled?</text>
<rect x="10.0" y="355.0" width="80.0" height="30.0" rx="5" ry="5" fill="#D5E8D4" stroke="none" stroke-width="1.0"/>
<text x="50.0" y="371.8" text-anchor="middle" font-size="12" fill="#2C3E50" font-family="Arial,sans-serif">ALLOW</text>
<rect x="290.0" y="420.0" width="150.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="365.0" y="444.2" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">4. INSERT session + login_attempt</text>
<rect x="140.0" y="480.0" width="130.0" height="45.0" rx="5" ry="5" fill="#D5E8D4" stroke="#82B366" stroke-width="1.0"/>
<text x="205.0" y="504.2" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">5. {access_token, refresh_token}</text>
<rect x="380.0" y="355.0" width="130.0" height="30.0" rx="5" ry="5" fill="#FFF2CC" stroke="none" stroke-width="1.0"/>
<text x="445.0" y="371.8" text-anchor="middle" font-size="12" fill="#2C3E50" font-family="Arial,sans-serif">MFA_REQUIRED</text>
<rect x="400.0" y="435.0" width="130.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="465.0" y="459.2" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">6. INSERT pre_auth_transaction</text>
<rect x="140.0" y="545.0" width="130.0" height="45.0" rx="5" ry="5" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="205.0" y="569.1" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">7. {mfa_required:true, session_id}</text>
<text x="340.0" y="619.1" text-anchor="middle" font-size="11" fill="#9673A6" font-family="Arial,sans-serif">──────── MFA Verify ────────</text>
