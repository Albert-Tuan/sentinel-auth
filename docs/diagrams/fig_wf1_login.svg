<text x="220.0" y="654.1" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">8. POST /auth/mfa/verify (session_id, mfa_code)</text>
<rect x="290.0" y="630.0" width="140.0" height="45.0" rx="0" ry="0" fill="#FFF2CC" stroke="#D6A656" stroke-width="1.0"/>
<text x="360.0" y="654.1" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial,sans-serif">9. SELECT pre_auth_transaction</text>
