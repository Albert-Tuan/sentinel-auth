name: sentinel-auth

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./infra/postgres/02-ml-service-schema.sql:/docker-entrypoint-initdb.d/02-ml-service-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  core-app:
    build: ./core-app
    environment:
      SERVICE_NAME: core-app
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-change-me-for-local-only}@postgres:5432/core_app
      REDIS_URL: redis://redis:6379/0
      INTERNAL_DEV_TOKEN: ${INTERNAL_DEV_TOKEN:-local-dev-token-only}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-sentinel-auth-core}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinel-auth-browser}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@sentinel-auth.local}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-5}
      PRE_AUTH_TTL_SECONDS: ${PRE_AUTH_TTL_SECONDS:-300}
      MFA_OTP_TTL_SECONDS: ${MFA_OTP_TTL_SECONDS:-60}
      MFA_MAX_ATTEMPTS: ${MFA_MAX_ATTEMPTS:-3}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_POLICY_VERSION: ${AUTH_POLICY_VERSION:-core-auth-v1}
      # These are required only if the database has no users; bootstrap validates
      # them at that point so an existing deployment need not retain a password.
      INITIAL_SECURITY_ADMIN_USERNAME: ${INITIAL_SECURITY_ADMIN_USERNAME:-}
      INITIAL_SECURITY_ADMIN_EMAIL: ${INITIAL_SECURITY_ADMIN_EMAIL:-}
      INITIAL_SECURITY_ADMIN_PASSWORD: ${INITIAL_SECURITY_ADMIN_PASSWORD:-}
    ports:
      - "${CORE_APP_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  detection-engine:
    build: ./detection-engine
    environment:
      SERVICE_NAME: detection-engine
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
      DATABASE_URL: postgresql+psycopg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/detection_engine
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8000
      INTERNAL_DEV_TOKEN: ${INTERNAL_DEV_TOKEN:-local-dev-token-only}
    ports:
      - "${DETECTION_ENGINE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ml-service:
    build: ./ml-service
    environment:
      SERVICE_NAME: ml-service
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
      DATABASE_URL: postgresql+psycopg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/ml_service
      INTERNAL_DEV_TOKEN: ${INTERNAL_DEV_TOKEN:-local-dev-token-only}
      APP_ENV: development
      ML_MODEL_DIR: /app/models
    ports:
      - "${ML_SERVICE_PORT:-8003}:8000"
    volumes:
      - ./ml-service/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
