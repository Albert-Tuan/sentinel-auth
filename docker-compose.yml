# Sentinel Auth v3.3 — Local Development Infrastructure
#
# This compose file starts shared infrastructure only.
# The application (FastAPI monolith) is started separately.
#
# Three logical PostgreSQL databases are created and bootstrapped:
#   sentinel_core       — Core/Auth service tables
#   sentinel_detection  — Detection Engine tables
#   sentinel_ml        — ML Service tables
#
# One Redis instance is started for future outbox/stream-based event transport.
#
# Usage:
#   docker compose up -d
#   docker compose ps          # verify health
#   docker compose down        # stop services
#   docker compose down -v    # stop + destroy volumes (full reset)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bootstrap schemas on first run (init scripts run once when data directory is empty).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Schema files (read-only, mounted so init script can reference them).
      - ./infra/postgres:/schemas:ro
      # Persistent project-scoped data volume.
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: >
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: sentinel_postgres_data
  redis_data:
    name: sentinel_redis_data
